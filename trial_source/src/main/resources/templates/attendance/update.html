<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>
<body>	
	<th:block th:if="${session.loginUserDto.role == '0001'}">
        <h2>勤怠管理</h2>
    </th:block>
    
    <th:block th:if="${#fields.hasErrors('attendanceForm.*')}">
		<ul style="color: red;">
			<li th:each="error : ${#fields.errors('attendanceForm.*')}"
				th:text="${error}"
			>
			</li>
		</ul>
		
	</th:block>

    <th:block th:if="${session.loginUserDto.role != '0001'}">
        <h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
        <th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
            <h2><small>途中退校日：${dispLeaveDate}</small></h2>
        </th:block>
    </th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">
				
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<th class="w60"></th>
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>									

								<td class="w60"></td>
					
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" class="form-control"
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeHour')
													or #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTime')} ? 'background-color: #fdd; border: 1px solid red;' : ''">
										<option th:each="hourMap : ${attendanceForm.hourMap}" 
												th:value="${hourMap.key}" 
												th:inline="text" 
												class="form-control"																								
												th:selected="${hourMap.key == dailyAttendanceForm.trainingStartTimeHour
												and !(#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeHour') 
												or  #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTime'))
												}"> 
												[[${hourMap.value}]]				
										</option>
									</select>
								</td>								
								<td>:</td>								
								<td>
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" class="form-control"
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeMinute')
													or #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTime')} ? 'background-color: #fdd; border: 1px solid red;' : '' ">
										<option th:each="minuteMap : ${attendanceForm.minuteMap}" 
												th:value="${minuteMap.key}" 
												th:inline="text" 
												class="form-control"
												th:selected="${minuteMap.key == dailyAttendanceForm.trainingStartTimeMinute
												and !(#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeMinute') 
												or  #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTime'))
												}"> 
												[[${minuteMap.value}]]				
										</option>
									</select>
								</td>
								
								<td>
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|" class="form-control"
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeHour') 
													or #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTime')} ? 'background-color: #fdd; border: 1px solid red;' : '' ">
										<option th:each="hourMap : ${attendanceForm.hourMap}" 
												th:value="${hourMap.key}" 
												th:inline="text" 
												class="form-control"
												th:selected="${hourMap.key == dailyAttendanceForm.trainingEndTimeHour
												and !(#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeHour') 
												or  #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTime'))
												}"> 
												[[${hourMap.value}]]				
										</option>
									</select>
								</td>
								<td>:</td>															
								<td>
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" class="form-control"
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeMinute') 
													or #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTime')} ? 'background-color: #fdd; border: 1px solid red;' : '' ">
										<option th:each="minuteMap : ${attendanceForm.minuteMap}" 
												th:value="${minuteMap.key}" 
												th:inline="text" 
												class="form-control"
												th:selected="${minuteMap.key == dailyAttendanceForm.trainingEndTimeMinute
													and !(#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeMinute') 
													or  #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTime'))
													}"> 
												[[${minuteMap.value}]]							
										</option>
									</select>
								</td>

								<td>
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control"
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].blankTime') 
													or #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].blankTimeValue')} ? 'background-color: #fdd; border: 1px solid red;' : '' "
										>
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inline="text" class="form-control" 											
												th:selected="${blankTime.key == dailyAttendanceForm.blankTime
													and !(#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].blankTime') 
													or  #fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].blankTimeValue'))
													}">
												[[${blankTime.value}]]
										</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w140">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"
									 th:style="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].note')} ? 'background-color: #fdd; border: 1px solid red;' : '' "></input>
								</td>					    
	 </div>
							</tr>
						</th>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" id="showConfirmDialog" />
				</div>

			</form>
		</div>
	</div>
	<script th:inline="javascript">
			// JQueryを使った書き方で統一
				
			$(function(){
				$('#showConfirmDialog').on('click', function(e){
				// 確認ダイアログを表示
				if(!confirm('更新します。よろしいですか？')){
					e.preventDefault();// キャンセル押下時、フォーム送信をキャンセル	
				}
			  });
			});
	</script>

</body>
</html>
